# Adrt Windows port (C#) CI
#
# Gates for the native Windows port under windows/:
#   restore/build — the whole solution with warnings promoted to errors. The core
#                   is pure and the host is a thin Win32 adapter; compiler and
#                   analyzer warnings are treated as defects, as on the GJS side.
#   test          — Adrt.Core.Tests (model parity) plus Adrt.Architecture.Tests
#                   (purity, dependency direction, public-API snapshot).
#   format        — dotnet format --verify-no-changes (merge gate).
#
# The Windows host is net10.0-windows and needs Windows APIs at runtime, so this
# job runs on windows-latest. The solution still builds on Linux with
# EnableWindowsTargeting, but the host is only exercised here.
name: Windows port CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test and format (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore windows/Adrt.slnx

      - name: Build (warnings are errors)
        run: dotnet build windows/Adrt.slnx --no-restore -warnaserror

      - name: Test
        run: dotnet test windows/Adrt.slnx --no-build

      - name: Format check
        run: dotnet format windows/Adrt.slnx --verify-no-changes --no-restore
